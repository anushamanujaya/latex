services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["latex_mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongo:27017", "--eval", "try { const cfg = rs.conf(); if (cfg.members[0].host !== 'localhost:27017') { cfg.members[0].host = 'localhost:27017'; rs.reconfig(cfg, {force:true}); } } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); }"]
volumes:
  latex_mongo:
